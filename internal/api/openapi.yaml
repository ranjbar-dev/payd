        `order_funded` unless you send `{"force": true}`. The guard exists because money
        has already arrived at the address and cancelling does not return it — settle or
        refund the payer yourself. A forced cancellation of an order that received
        anything is recorded as `cancelled_funded`, not `cancelled`, so it stays visible
        in `GET /api/v1/orders/funded-terminal` until you resolve it.

        **Already-finished orders** (`expired`, `expired_funded`, `cancelled`,
        `cancelled_funded`) are 409 `order_terminal` — `force` does not override this.

        **Side effect.** The order's address is released into a cooldown period and is not
        handed to a new order until that window passes, so a late payment to the old
        address is not mistaken for payment of a new order.

