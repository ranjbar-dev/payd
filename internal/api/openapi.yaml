openapi: 3.1.0
info:
  title: payd HTTP API
  version: 1.0.0
  description: |
    The HTTP API served by payd, a self-hosted TRON payment processor. It creates
    payment orders against pooled TRON addresses, reports the payments detected on
    chain for them, and moves funds out again through operator-approved withdrawals.

    **Money is always a decimal string**, never a JSON number — `"1.5"`, not `1.5`.
    JSON numbers cannot represent every base-unit value exactly, so every amount
    field in every request and response is a string. Fields ending in `_raw` are in
    base units (SUN for TRX, 6-decimal units for USDT); all other amount fields are
    in whole asset units.

    **Authentication** is a shared secret in the `X-API-Key` request header. Each key
    carries its own set of scopes (`orders:read`, `orders:write`, `wallets:read`,
    `wallets:write`, `withdrawals:read`, `withdrawals:write`, `resources:write`,
    `admin:read`), and every operation
    below states the one scope it requires. A missing key, a wrong key, or a key
    without the required scope all return the same 401 with no further detail.

    **Rate limits** are counted per API key in fixed one-minute windows: 100 requests
    per minute in general, and 10 requests per minute on `/api/v1/withdrawals` and its
    subpaths. Exceeding either returns 429 `rate_limited`.

    **Errors** always use the envelope `{"error": {"code", "message", "details"}}`.
    Match on `code`, not on `message`. Each operation lists the codes it can emit under
    the `x-error-codes` extension. The two exceptions are `/readyz`, which reports
    degradation using its own readiness shape, and `/metrics`, which is plain text.

    `/healthz`, `/readyz`, `/metrics`, `/openapi.yaml` and `/docs` require no key and
    are not rate limited. They are unauthenticated because the server is expected to
    bind loopback or a private interface; do not expose it publicly without a proxy
    in front.
servers:
  - url: http://127.0.0.1:8080
security:
  - apiKey: []
tags:
  - name: Orders
  - name: Payments
  - name: Wallets
  - name: Withdrawals
  - name: Operations
  - name: Documentation
paths:
  /api/v1/chain/status:
    get:
      tags: [Operations]
      summary: Inspect chain progress
      description: Returns follower, solidity, lag, and reorg state. Requires scope `wallets:read`.
      x-required-scope: wallets:read
      x-requirements: [API-037]
      responses:
        '200':
          description: Chain progress.
          content:
            application/json:
              schema:
                type: object
                required: [last_height, solidified_height, lag_blocks, lag_seconds, reorg_suspected, last_block_timestamp]
                properties:
                  last_height: {type: integer, format: int64}
                  solidified_height: {type: integer, format: int64}
                  lag_blocks: {type: integer, format: int64}
                  lag_seconds: {type: integer, format: int64}
                  reorg_suspected: {type: boolean}
                  last_block_timestamp: {type: integer, format: int64}

  /api/v1/chain/quota:
    get:
      tags: [Operations]
      summary: Inspect TronGrid quota usage
      description: Returns today's persisted usage and the last seven UTC days. Requires scope `wallets:read`.
      x-required-scope: wallets:read
      x-requirements: [API-038, RL-006]
      responses:
        '200':
          description: Quota usage.
          content:
            application/json:
              schema:
                type: object
                required: [requests_today, daily_request_quota, percent_used, history]
                properties:
                  requests_today: {type: integer, format: int64}
                  daily_request_quota: {type: integer, format: int64}
                  percent_used: {type: number}
                  history:
                    type: array
                    items:
                      type: object
                      required: [day_start, requests]
                      properties:
                        day_start: {type: integer, format: int64}
                        requests: {type: integer, format: int64}

  /api/v1/workers:
    get:
      tags: [Operations]
      summary: List supervised worker health
      description: Returns persisted heartbeat and error state for every worker. `last_tick_at` advances every tick, so a stalled worker shows as a growing `seconds_since_tick`; `last_error` is sticky and `error_count` cumulative, so a recovered fault stays visible. Requires scope `wallets:read`.
      x-required-scope: wallets:read
      x-requirements: [API-039, OPS-008]
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Worker health.
          content:
            application/json:
              schema:
                type: object
                required: [workers, next_cursor]
                properties:
                  workers:
                    type: array
                    items:
                      type: object
                      required: [worker, last_tick_at, seconds_since_tick, last_error, error_count, restarts]
                      properties:
                        worker: {type: string}
                        last_tick_at: {type: [integer, 'null'], format: int64}
                        seconds_since_tick: {type: [integer, 'null'], format: int64}
                        last_error: {type: string}
                        error_count: {type: integer, format: int64}
                        restarts: {type: integer, format: int64}
                  next_cursor: {type: string}

  /api/v1/audit:
    get:
      tags: [Operations]
      summary: Read the audit log
      description: Lists newest audit records with exact filters. Requires scope `admin:read`.
      x-required-scope: admin:read
      x-requirements: [API-040]
      parameters:
        - {name: actor, in: query, schema: {type: string}}
        - {name: action, in: query, schema: {type: string}}
        - {name: subject, in: query, schema: {type: string}}
        - {name: from, in: query, schema: {type: integer, format: int64}}
        - {name: to, in: query, schema: {type: integer, format: int64}}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Audit page.
          content:
            application/json:
              schema:
                type: object
                required: [entries, next_cursor]
                properties:
                  entries:
                    type: array
                    items:
                      type: object
                      required: [id, actor, action, subject, detail, ip, created_at]
                      properties:
                        id: {type: integer, format: int64}
                        actor: {type: string}
                        action: {type: string}
                        subject: {type: string}
                        detail: {type: string}
                        ip: {type: string}
                        created_at: {type: integer, format: int64}
                  next_cursor: {type: string}

  /api/v1/resources/grants:
    get:
      tags: [Wallets]
      summary: List resource grants
      description: Lists resource acquisition attempts and outcomes. Requires scope `wallets:read`.
      x-required-scope: wallets:read
      x-requirements: [API-041]
      parameters:
        - {name: withdrawal_id, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string}}
        - {name: resource_type, in: query, schema: {type: string, enum: [ENERGY, BANDWIDTH]}}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Resource grant page.
          content:
            application/json:
              schema:
                type: object
                required: [grants, next_cursor]
                properties:
                  grants: {type: array, items: {type: object, additionalProperties: true}}
                  next_cursor: {type: string}

  /api/v1/resources/wallet:
    get:
      tags: [Wallets]
      summary: Inspect the resource wallet
      description: Returns its TRX, resources, and outstanding delegations. Requires scope `wallets:read`.
      x-required-scope: wallets:read
      x-requirements: [API-042, RES-014]
      responses:
        '200':
          description: Resource wallet state.
          content:
            application/json:
              schema:
                type: object
                required: [address, trx_balance, energy, bandwidth, outstanding_delegations]
                properties:
                  address: {type: string}
                  trx_balance: {type: string}
                  energy: {type: object, additionalProperties: true}
                  bandwidth: {type: object, additionalProperties: true}
                  outstanding_delegations: {type: object, additionalProperties: true}

  /api/v1/config:
    get:
      tags: [Operations]
      summary: Read redacted effective configuration
      description: Returns an allowlisted configuration projection with no credentials. Requires scope `admin:read`.
      x-required-scope: admin:read
      x-requirements: [API-043, CFG-011]
      responses:
        '200':
          description: Redacted effective configuration.
          content:
            application/json:
              schema:
                type: object
                required: [assets, withdrawal, tron, orders, energy, consumers]
                properties:
                  assets: {type: array, items: {type: object, additionalProperties: true}}
                  withdrawal: {type: object, additionalProperties: true}
                  tron: {type: object, additionalProperties: true}
                  orders: {type: object, additionalProperties: true}
                  energy: {type: object, additionalProperties: true}
                  consumers: {type: array, items: {type: string}}

  /api/v1/reports/volume:
    get:
      tags: [Operations]
      summary: Report order volume
      description: Groups paid/confirmed received volume over an inclusive UTC range. Requires scope `orders:read`.
      x-required-scope: orders:read
      x-requirements: [API-044, DB-002a]
      parameters:
        - {name: from, in: query, required: true, schema: {type: integer, format: int64}}
        - {name: to, in: query, required: true, schema: {type: integer, format: int64}}
        - {name: group_by, in: query, schema: {type: string, enum: [day, asset, consumer], default: day}}
      responses:
        '200':
          description: Exact-decimal volume buckets; unpriced_paid_count identifies rows excluded from USD totals.
          content:
            application/json:
              schema:
                type: object
                required: [group_by, from, to, buckets]
                properties:
                  group_by: {type: string}
                  from: {type: integer, format: int64}
                  to: {type: integer, format: int64}
                  buckets: {type: array, items: {type: object, additionalProperties: true}}

  /api/v1/reports/fees:
    get:
      tags: [Operations]
      summary: Report withdrawal resource fees
      description: Returns exact TRX costs for withdrawals created in the inclusive range, by energy and bandwidth source. Requires scope `wallets:read`.
      x-required-scope: wallets:read
      x-requirements: [API-045]
      parameters:
        - {name: from, in: query, required: true, schema: {type: integer, format: int64}}
        - {name: to, in: query, required: true, schema: {type: integer, format: int64}}
      responses:
        '200':
          description: Fee totals.
          content:
            application/json:
              schema:
                type: object
                required: [from, to, energy_by_source_trx, bandwidth_by_source_trx, rental_spend_trx]
                properties:
                  from: {type: integer, format: int64}
                  to: {type: integer, format: int64}
                  energy_by_source_trx: {type: object, additionalProperties: {type: string}}
                  bandwidth_by_source_trx: {type: object, additionalProperties: {type: string}}
                  rental_spend_trx: {type: string}

  /api/v1/export/orders.csv:
    get:
      tags: [Operations]
      summary: Stream orders as CSV
      description: Streams filtered order rows, default 10000 and maximum 100000. Requires scope `orders:read`.
      x-required-scope: orders:read
      x-requirements: [API-046]
      parameters:
        - {name: status, in: query, schema: {type: string}}
        - {name: asset, in: query, schema: {type: string}}
        - {name: external_ref, in: query, schema: {type: string}}
        - {name: consumer, in: query, schema: {type: string}}
        - {name: address, in: query, schema: {type: string}}
        - {name: created_from, in: query, schema: {type: integer, format: int64}}
        - {name: created_to, in: query, schema: {type: integer, format: int64}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100000, default: 10000}}
      responses:
        '200': {description: Streaming CSV attachment., content: {text/csv: {schema: {type: string}}}}

  /api/v1/export/withdrawals.csv:
    get:
      tags: [Operations]
      summary: Stream withdrawals as CSV
      description: Streams status-filtered rows, default 10000 and maximum 100000. Requires scope `withdrawals:read`.
      x-required-scope: withdrawals:read
      x-requirements: [API-046]
      parameters:
        - {name: status, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100000, default: 10000}}
      responses:
        '200': {description: Streaming CSV attachment., content: {text/csv: {schema: {type: string}}}}

  /api/v1/payments:
    get:
      tags: [Payments]
      summary: Search payments
      description: |
        Searches detected payments by transaction, address, order, status, direction,
        asset, and block timestamp. Requires scope `orders:read`.
      x-required-scope: orders:read
      x-requirements: [API-027]
      parameters:
        - {name: txid, in: query, schema: {type: string}}
        - {name: address, in: query, schema: {type: string}}
        - {name: order_id, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string}}
        - {name: direction, in: query, schema: {type: string, enum: [in, out]}}
        - {name: asset, in: query, schema: {type: string}}
        - {name: from, in: query, schema: {type: integer, format: int64}}
        - {name: to, in: query, schema: {type: integer, format: int64}}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Matching payment page.
          content:
            application/json:
              schema:
                type: object
                required: [payments, next_cursor]
                properties:
                  payments: {type: array, items: {$ref: '#/components/schemas/Payment'}}
                  next_cursor: {type: string}

  /api/v1/orders/{id}/extend:
    post:
      tags: [Orders]
      summary: Extend an order
      description: |
        Adds time to a non-terminal order without allowing its total lifetime to
        exceed 24 hours from creation. Requires scope `orders:write`.
      x-required-scope: orders:write
      x-requirements: [API-029]
      parameters:
        - {$ref: '#/components/parameters/OrderID'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ttl_seconds]
              additionalProperties: false
              properties:
                ttl_seconds: {type: integer, format: int64, minimum: 1}
      responses:
        '200': {description: Extended order., content: {application/json: {schema: {$ref: '#/components/schemas/Order'}}}}
        '409': {$ref: '#/components/responses/Conflict'}

  /api/v1/orders/{id}/events:
    get:
      tags: [Orders]
      summary: List order webhook events
      description: |
        Lists delivery state for the order's immutable outbox events. Requires scope `orders:read`.
      x-required-scope: orders:read
      x-requirements: [API-030]
      parameters:
        - {$ref: '#/components/parameters/OrderID'}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Event page.
          content:
            application/json:
              schema:
                type: object
                required: [events, next_cursor]
                properties:
                  events:
                    type: array
                    items:
                      type: object
                      required: [id, consumer, event_type, status, attempts, last_status_code, last_error, created_at]
                      properties:
                        id: {type: string}
                        consumer: {type: string}
                        event_type: {type: string}
                        status: {type: string}
                        attempts: {type: integer}
                        last_status_code: {type: integer}
                        last_error: {type: string}
                        created_at: {type: integer, format: int64}
                        delivered_at: {type: [integer, 'null'], format: int64}
                  next_cursor: {type: string}

  /api/v1/withdrawals/{id}/resolve:
    post:
      tags: [Withdrawals]
      summary: Record an operator resolution
      description: |
        Records a terminal human decision for a needs_operator row. It never signs,
        broadcasts, retries, or changes txid. Requires scope `withdrawals:write`.
      x-required-scope: withdrawals:write
      x-requirements: [API-031, API-015, API-022, WDR-018]
      parameters:
        - {$ref: '#/components/parameters/WithdrawalID'}
        - name: X-TOTP
          in: header
          required: true
          schema: {type: string, pattern: '^[0-9]{6}$'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome, failure_reason]
              additionalProperties: false
              properties:
                outcome: {type: string, enum: [confirmed, failed]}
                failure_reason: {type: string}
      responses:
        '200': {description: Resolved withdrawal., content: {application/json: {schema: {$ref: '#/components/schemas/Withdrawal'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}

  /api/v1/withdrawals/estimate:
    post:
      tags: [Withdrawals]
      summary: Estimate a withdrawal
      description: |
        Performs a read-only balance, resource, cost, and daily-cap projection with
        no TOTP and zero state writes. Requires scope `withdrawals:read`.
      x-required-scope: withdrawals:read
      x-requirements: [API-032, API-010]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from_address, to_address, asset, amount]
              additionalProperties: false
              properties:
                from_address: {type: string}
                to_address: {type: string}
                asset: {type: string}
                amount: {$ref: '#/components/schemas/Amount'}
      responses:
        '200':
          description: Read-only projection.
          content:
            application/json:
              schema:
                type: object
                required: [confirmed_balance_sufficient, projected_energy_source, projected_trx_cost, daily_cap_blocked, blocked_by]
                properties:
                  confirmed_balance_sufficient: {type: boolean}
                  projected_energy_source: {type: string, enum: [existing, rented, self_delegated, burned, '']}
                  projected_trx_cost: {$ref: '#/components/schemas/Amount'}
                  daily_cap_blocked: {type: boolean}
                  blocked_by: {type: array, items: {type: string}}

  /api/v1/auth/whoami:
    get:
      tags: [Operations]
      summary: Describe the authenticated key
      description: |
        Returns the authenticated key name and scopes. Requires no scope.
      x-requirements: [API-033]
      responses:
        '200':
          description: Authenticated key identity.
          content:
            application/json:
              schema:
                type: object
                required: [key_name, scopes]
                properties:
                  key_name: {type: string}
                  scopes: {type: array, items: {type: string}}

  /api/v1/assets:
    get:
      tags: [Operations]
      summary: List configured assets
      description: |
        Lists public asset metadata used for exact client-side amount conversion. Requires no scope.
      x-requirements: [API-034]
      responses:
        '200':
          description: Configured assets.
          content:
            application/json:
              schema:
                type: object
                required: [assets]
                properties:
                  assets:
                    type: array
                    items:
                      type: object
                      required: [symbol, kind, contract, decimals, min_deposit, verified]
                      properties:
                        symbol: {type: string}
                        kind: {type: string}
                        contract: {type: string}
                        decimals: {type: integer}
                        min_deposit: {$ref: '#/components/schemas/Amount'}
                        verified: {type: boolean}

  /api/v1/ipn/test:
    post:
      tags: [IPN]
      summary: Send a test webhook
      description: |
        Sends one signed test.ping directly to a configured consumer without writing
        to the outbox. Requires scope `orders:write`.
      x-required-scope: orders:write
      x-requirements: [API-035, IPN-006, IPN-007]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [consumer]
              additionalProperties: false
              properties:
                consumer: {type: string}
      responses:
        '200':
          description: Test delivery result.
          content:
            application/json:
              schema:
                type: object
                required: [status_code, latency_ms]
                properties:
                  status_code: {type: integer}
                  latency_ms: {type: integer, format: int64}

  /api/v1/ipn/replay:
    post:
      tags: [IPN]
      summary: Replay dead webhooks in bulk
      description: |
        Counts or resets up to 200 matching dead events. dry_run defaults to true.
        Requires scope `orders:write`.
      x-required-scope: orders:write
      x-requirements: [API-036]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                consumer: {type: string}
                from: {type: integer, format: int64}
                to: {type: integer, format: int64}
                dry_run: {type: boolean, default: true}
      responses:
        '200':
          description: Number of matching or replayed events, capped at 200.
          content:
            application/json:
              schema:
                type: object
                required: [count]
                properties:
                  count: {type: integer, maximum: 200}

  /api/v1/orders:
    post:
      tags: [Orders]
      summary: Create or replay an order
      description: |
        Creates a payment order and assigns it a TRON address from the pool. The payer
        sends funds to that address; the chain follower attributes incoming transfers to
        the order and advances its status. Returns 201 for a new order, 200 for a replay.

        Requires scope `orders:write`. Rate limit 100 requests/minute per API key.

        **Amount.** Supply exactly one of `amount` (whole asset units) or `amount_usd`.
        Both or neither is 400 `invalid_order`. A USD amount is converted at the current
        price and must land on a whole base unit, otherwise 400 `invalid_amount`. The
        price and the time it was fetched are snapshotted onto the order, so later price
        movement never changes what the payer owes.

        **Idempotency** is keyed on `external_ref`. Sending the same `external_ref` again
        returns the existing order with 200 — but only when `asset`, expected amount and
        `consumer` all match. Any mismatch is 409 `external_ref_conflict`, and
        `details.fields` names exactly which of the three differ. Omit `external_ref` and
        every call creates a new order.

        **Consumer.** Determines where payment webhooks are delivered. Empty falls back to
        the configured default consumer; an unknown or disabled consumer is 400
        `invalid_order`. A consumer cannot be changed after the order is created.

        **Other fields.** `ttl_seconds` of 0 (or absent) falls back to the configured
        default order TTL; the resulting `expires_at` is when an unpaid order expires and
        its address is recycled. `metadata` must be a JSON object and is stored verbatim
        and echoed back. Unknown JSON fields are rejected with 400 `invalid_request`, as
        is a body over 1 MiB.

        **Unavailability.** 503 `price_unavailable` when no price quote exists or the last
        one is older than the configured staleness limit — an order is never created at a
        guessed rate. 503 `address_pool_exhausted` when every pooled address is in use and
        the pool is already at its configured maximum size; retry after orders expire or
        raise the limit.
      x-required-scope: orders:write
      x-requirements: [API-001, API-002, API-003, API-004, API-005, API-006, API-020, API-024]
      x-error-codes:
        400: [invalid_request, invalid_order, invalid_amount]
        401: [unauthorized]
        409: [external_ref_conflict]
        429: [rate_limited]
        500: [internal_error]
        503: [price_unavailable, address_pool_exhausted]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
            example:
              asset: USDT
              amount: '1.5'
              external_ref: smoke-1
              consumer: local
              ttl_seconds: 1800
              metadata: {user_id: 1}
      responses:
        '200':
          description: |
            Replay. The `external_ref` matched an existing order on asset, amount and
            consumer, so that order is returned unchanged and nothing new was created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
        '201':
          description: A new order was created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
              example:
                address: TUEZSdKsoDHQMeZwihtdoBiN46zxhGWYdH
                amount: '1.5'
                amount_usd: '1.50'
                asset: USDT
                consumer: local
                created_at: 1786277759
                expires_at: 1786279559
                external_ref: smoke-1
                id: 01KZK772CKH6G9KTEM09TB7AFS
                metadata: {user_id: 1}
                overpaid: '0'
                price_usd: '1.00'
                received: '0'
                status: pending
                updated_at: 1786277759
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409':
          description: |
            The `external_ref` is already bound to a different order. `details.fields`
            lists which of `asset`, `expected_raw` (the amount) or `consumer` disagree.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example:
                error:
                  code: external_ref_conflict
                  details: {fields: [expected_raw]}
                  message: external_ref belongs to a different order request
        '429': {$ref: '#/components/responses/RateLimited'}
