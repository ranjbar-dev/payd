      type: object
      additionalProperties: false
      required: [status]
      properties: {status: {type: string, const: ok}}
    Readiness:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {type: string, enum: [ready, degraded]}
        reasons: {type: array, items: {type: string}, example: [price_stale]}
