        '200': {description: Provider status., content: {application/json: {schema: {$ref: '#/components/schemas/EnergyStatus'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/energy/purchases:
    get:
      tags: [Energy]
      summary: List energy purchases
      description: |
        Lists quoted and actual costs, outcomes, withdrawals and delegation transaction ids.
        Requires scope `wallets:read`. Uses opaque cursor pagination.
      x-required-scope: wallets:read
      x-requirements: [API-003, API-020, API-025, ENR-009]
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Cursor'}]
      responses:
        '200': {description: Purchase page., content: {application/json: {schema: {$ref: '#/components/schemas/EnergyPurchasePage'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/wallets/needs-resources:
    get:
      tags: [Wallets]
      summary: List wallets needing resources
      description: |
        Lists every pooled address that cannot currently send a transaction because it is
        short of TRON resources, and explains what each one is missing. On TRON a transfer
        consumes bandwidth, and a token transfer also consumes energy; an address without
        enough of either must burn TRX instead, and with no TRX it is stuck. Use this to
        decide where to delegate or rent resources before a withdrawal is attempted.

        Requires scope `wallets:read`. Rate limit 100 requests/minute per API key.

        **This endpoint returns the complete set in one response.** The `limit` and
        `cursor` parameters are accepted for consistency with the other list endpoints but
        are ignored, and there is no `next_cursor`.

        Per address the response gives:

        - `energy` and `bandwidth`: what is `available`, the account `limit`, how much is
          `required` by configuration, and whether that is `sufficient`.
        - `balances[]`: per asset, `confirmed` and `pending` reported separately (only
          confirmed funds can be withdrawn), plus a `drift_detected` flag. The `usd` field
          is omitted rather than guessed when no fresh price quote is available.
        - `can_withdraw`: a per-asset map. An asset is withdrawable only when the address
          has no balance drift, can cover bandwidth (held or burnable with TRX), and — for
          token assets only — has enough energy. TRX itself needs no energy.
        - `blocked_by`: which of `bandwidth` or `energy` is short.
        - `estimated_burn_trx` and `energy_fee_sun`: what a transfer would cost in burned
          TRX at the current on-chain energy price. Present only once chain parameters
          have been read.
        - `checked_at`: when the address was last polled on chain; absent if never polled.
      x-required-scope: wallets:read
      x-requirements: [API-003, API-010, API-011, API-012, API-013, API-014, API-020, API-024, API-025]
      x-error-codes:
        401: [unauthorized]
        429: [rate_limited]
        500: [internal_error]
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Resource-needy wallet list.
          content: {application/json: {schema: {$ref: '#/components/schemas/WalletResourceList'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/wallets/{address}/clear-drift:
    parameters:
      - name: address
        in: path
        required: true
        schema: {type: string, example: TUEZSdKsoDHQMeZwihtdoBiN46zxhGWYdH}
    post:
      tags: [Wallets]
      summary: Clear balance drift after operator review
      description: |
        Clears the balance-drift flag on an address after a human has checked it.

        Drift means the balance the processor computed from the payments it recorded no
        longer matches the balance the chain reports — funds moved by some path the
        processor did not see, or a payment was missed. While the flag is set, every
        withdrawal from that address is refused with 409 `balance_drift`, because signing
        against a balance you do not trust risks spending money that is not there. This
        endpoint is the only way to lift that block.

        Requires scope `wallets:write`. Rate limit 100 requests/minute per API key.

        **Reconcile before calling.** Compare the address on a block explorer with the
        payments the processor holds and account for the difference first; clearing the
        flag does not correct any balance, it only stops the alarm.

        The request takes no body — any body sent is ignored. The flag is cleared for
        **all assets** on the address at once, and clearing an address that was not
        actually flagged still succeeds. The response is always
        `{"drift_detected": false}`.

        **Side effect.** Writes an audit-log entry with the API key name, the caller's IP
        address and how many balance rows were cleared.

        An unknown address is 404 `not_found`.
      x-required-scope: wallets:write
      x-requirements: [API-020, API-024, BAL-002]
      x-error-codes:
        401: [unauthorized]
        404: [not_found]
        429: [rate_limited]
        500: [internal_error]
      responses:
        '200':
          description: Drift flag cleared.
          content:
            application/json:
              schema:
                type: object
                required: [drift_detected]
                properties: {drift_detected: {type: boolean, const: false}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/withdrawals:
    post:
      tags: [Withdrawals]
      summary: Create or replay a withdrawal request
      description: |
        Requests a transfer of funds out of a pooled address to an external address.

        Requires scope `withdrawals:write`. Rate limit **10 requests/minute** per API key
        on this path and its subpaths, not the usual 100.

        **This endpoint only records the request.** It returns as soon as the row is
        stored in status `requested`; a background worker acquires resources, signs and
        broadcasts the transaction afterwards. Poll `GET /api/v1/withdrawals/{id}` for the
        outcome. A 201 means "accepted", never "sent".

        **Idempotency-Key is mandatory** and is checked *before* the TOTP code is even
        looked at. That ordering is deliberate: a client that times out and retries sends
        the same key together with the same TOTP code, and treating that as a replayed
        code would reject an honest retry. A missing header is 400
        `missing_idempotency_key`.

        - Key already used, and `from_address`, `to_address`, `asset` and `amount` all
          match: 200 with the stored withdrawal. Nothing new is created and the TOTP code
          is not consumed a second time.
        - Key already used with any different value: 409 `idempotency_key_reuse`. Pick a
          fresh key for a genuinely different transfer.
        - New key: 201 with the newly created withdrawal.

        **TOTP.** When required by configuration, `totp` must be a 6-digit code from the
        configured authenticator secret. Codes are accepted within one 30-second step
        either side of the current one, and each code is consumed once — its use is stored
        in the database, so a restart does not make it reusable. Any failure (bad code,
        already used, no secret configured) is 401 `invalid_totp`. Request bodies are
        never written to the logs, so codes do not leak there.

        **Checks, in the order they are applied.** Withdrawals disabled in configuration:
        503 `withdrawals_disabled`. Unknown asset: 400 `invalid_asset`. Malformed
        destination address or a non-positive amount: 400 `invalid_withdrawal`. No fresh
        price quote for the USD valuation: 503 `price_unavailable`. Source address unknown
        or disabled: 400 `invalid_source`. Source flagged for balance drift: 409
        `balance_drift` — clear it via `POST /api/v1/wallets/{address}/clear-drift` first.
        Amount above the source's **confirmed** balance: 409
        `insufficient_confirmed_balance`; pending funds are never spendable. Amount that
        would push the running USD total past the daily cap: 409 `daily_limit_exceeded` —
        check the remaining allowance with `GET /api/v1/withdrawals/limits`. The cap is
        enforced as part of the same database write, so two concurrent requests cannot
        both slip under it.

        **There is no retry, resume or re-broadcast endpoint anywhere in this API.** A
        withdrawal that fails is terminal; to try again, submit a new request with a new
        `Idempotency-Key`. This is a deliberate safety property — nothing in the system can
        re-broadcast a signed transfer, so a stuck withdrawal can never quietly send twice.

        **Side effects.** Stores the withdrawal in status `requested`, recording the API
        key name and the caller's IP as the requester, and writes an audit-log entry.
      x-required-scope: withdrawals:write
      x-requirements: [API-003, API-015, API-020, API-022, API-023, API-024, API-026, WDR-001a]
      x-error-codes:
        400: [invalid_request, missing_idempotency_key, invalid_asset, invalid_withdrawal, invalid_source]
        401: [unauthorized, invalid_totp]
        409: [idempotency_key_reuse, balance_drift, daily_limit_exceeded, insufficient_confirmed_balance]
        429: [rate_limited]
        500: [internal_error]
        503: [withdrawals_disabled, price_unavailable]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: >-
            Caller-chosen key that identifies this withdrawal request. Reuse it verbatim
            when retrying a request whose response you did not receive; use a new one for
            every genuinely new transfer.
          schema: {type: string, example: w-001}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateWithdrawalRequest'}
      responses:
        '200':
          description: >-
            Replay. The Idempotency-Key matched an existing request with identical
            details, so that withdrawal is returned as-is; no second transfer was created
            and the TOTP code was not consumed again.
          content: {application/json: {schema: {$ref: '#/components/schemas/Withdrawal'}}}
        '201':
          description: >-
            Accepted and stored in status `requested`. Signing and broadcast happen
            asynchronously; poll `GET /api/v1/withdrawals/{id}` for the outcome.
          content: {application/json: {schema: {$ref: '#/components/schemas/Withdrawal'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
    get:
      tags: [Withdrawals]
      summary: List withdrawals
      description: |
        Lists withdrawal requests, newest first, optionally filtered to one exact `status`.

        Requires scope `withdrawals:read`. Rate limit 10 requests/minute per API key, as
        on every `/api/v1/withdrawals` path.

        The response envelope is `{"items": [...]}` — note that it differs from the other
        list endpoints, and that it carries **no `next_cursor`**. `limit` (1-200, default
        50) is applied; `cursor` is validated if sent but has no effect, so this endpoint
        cannot page beyond the most recent `limit` rows. Raise `limit` to see further
        back, or fetch a specific row with `GET /api/v1/withdrawals/{id}`.
      x-required-scope: withdrawals:read
      x-requirements: [API-003, API-020, API-023, API-024, API-025]
      x-error-codes:
        400: [invalid_pagination]
        401: [unauthorized]
        429: [rate_limited]
        500: [internal_error]
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
        - name: status
          in: query
          schema: {type: string, example: requested}
      responses:
        '200':
          description: >-
            Withdrawals, newest first, in an `items` envelope with no cursor.
          content: {application/json: {schema: {$ref: '#/components/schemas/WithdrawalList'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/withdrawals/limits:
    get:
      tags: [Withdrawals]
      summary: Get the UTC-day withdrawal allowance
      description: |
        Reports how much of today's withdrawal allowance is left. Check this before
        submitting a large withdrawal to avoid a 409 `daily_limit_exceeded`.

        Requires scope `withdrawals:read`. Rate limit 10 requests/minute per API key, as
        on every `/api/v1/withdrawals` path.

        The window is the **UTC day** and resets at 00:00 UTC, not at local midnight.
        `used_usd` is the exact sum of the USD value of every withdrawal created since
        that boundary that is still requested, awaiting resources or energy, signing,
        broadcast, or confirmed — the same set the limit itself counts, so this figure
        always agrees with what a new request would be checked against. Failed and
        cancelled withdrawals do not consume allowance. `remaining_usd` is
        `daily_limit_usd` minus `used_usd`, never below zero.

        Each withdrawal's USD value is fixed at the price when it was requested, so
        `used_usd` does not move as the market does.
      x-required-scope: withdrawals:read
      x-requirements: [API-003, API-016, API-020, API-023, API-024]
      x-error-codes:
        401: [unauthorized]
        429: [rate_limited]
        500: [internal_error]
      responses:
        '200':
          description: Daily limit usage and remaining allowance.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WithdrawalLimits'}
              example: {daily_limit_usd: '5000', remaining_usd: '5000', used_usd: '0'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/withdrawals/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, example: 01KZK8B5H1KM6XACMG7MK57J8W}
    get:
      tags: [Withdrawals]
      summary: Get a withdrawal
      description: |
        Returns one withdrawal by its identifier. This is the endpoint to poll after a
        successful `POST /api/v1/withdrawals`, since that call only records the request
        and the transfer is signed and broadcast in the background.

        Requires scope `withdrawals:read`. Rate limit 10 requests/minute per API key, as
        on every `/api/v1/withdrawals` path.

        The response is designed so any outcome can be explained without a block-explorer
        lookup: `status` for where it stands, `txid` once broadcast, `failure_reason` and
        the raw `broadcast_response` from the node when it did not work, `resolved_by`
        when an operator closed it out, and a full cost breakdown in TRX
        (`network_fee_trx`, `energy_cost_trx`, `bandwidth_cost_trx`, `resource_fee_trx`,
        `total_cost_trx`) along with `energy_source` and `bandwidth_source` showing whether
        the resources were burned, delegated or rented.

        Remember there is no retry endpoint: a failed withdrawal stays failed, and a new
        attempt means a new request with a new `Idempotency-Key`.

        An unknown identifier is 404 `not_found`.
      x-required-scope: withdrawals:read
      x-requirements: [API-003, API-017, API-020, API-023, API-024]
      x-error-codes:
        401: [unauthorized]
        404: [not_found]
        429: [rate_limited]
        500: [internal_error]
      responses:
        '200':
          description: Withdrawal status and diagnostic detail.
          content: {application/json: {schema: {$ref: '#/components/schemas/Withdrawal'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
  /healthz:
    get:
      tags: [Operations]
      summary: Liveness probe
      description: |
        Returns 200 `{"status": "ok"}` for as long as the process is running and able to
        serve HTTP. Requires no scope. Needs no API key and is not rate limited.

        It is deliberately unconditional: it says nothing about the database, the chain
        follower, price freshness or any other worker, so a supervisor wired to this
        endpoint restarts the process only when it is truly wedged. For "should this
        instance receive traffic", use `/readyz` instead.
      x-required-scope: ''
      x-requirements: [OPS-002]
      security: []
      responses:
        '200':
          description: Process is alive.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
  /readyz:
    get:
      tags: [Operations]
      summary: Readiness probe
      description: |
        Reports whether the processor is healthy enough to be trusted right now. Returns
        200 `{"status": "ready"}` when everything is in order, or **503**
        `{"status": "degraded", "reasons": [...]}` when it is not. Requires no scope.
        Needs no API key and is not rate limited.

        Note this response uses its own shape in both cases — the 503 is a readiness
        document, not the `{"error": {...}}` envelope the rest of the API returns.

        Possible `reasons`:

        - `database_unavailable` / `database_unwritable` — the SQLite store cannot be read
          or cannot be written.
        - `chain_lag` — the follower is more than 20 blocks behind the chain head, so
          incoming payments are being detected late.
        - `solidified_stale` — the irreversible block height has not advanced for five
          minutes, so nothing can reach confirmed status.
        - `reorg_depth_exceeded` — a chain reorganisation deeper than the configured
          tolerance was seen and needs a human look.
        - `price_stale` — the newest price quote is older than the configured staleness
          limit. While this is set, orders priced in USD and all withdrawals are refused
          with 503 `price_unavailable`.
        - `clock_skew` / `clock_unavailable` — the local clock is more than 30 seconds off
          the reference, or could not be checked. TOTP validation depends on it.
        - `trongrid_quota_projection` — projected TronGrid API usage is at 90% or more of
          the plan's quota, so the node access this depends on is about to be throttled.
        - `energy_burn_ceiling` — withdrawals are burning more TRX for energy than the
          configured ceiling allows.

        Point load balancers and orchestrator readiness checks here; point restart-on-
        failure supervisors at `/healthz`.
      x-required-scope: ''
      x-requirements: [OPS-001]
      security: []
      responses:
        '200':
          description: Service is ready.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Readiness'}
        '503':
          description: Service is degraded. This operational response intentionally uses the readiness shape, not the API error envelope.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Readiness'}
              example: {reasons: [price_stale], status: degraded}
  /metrics:
    get:
      tags: [Operations]
      summary: Prometheus metrics
      description: |
        Prometheus text exposition of the processor's counters and gauges, served as
        `text/plain; version=0.0.4`. Requires no scope. Needs no API key and is not rate
        limited, on the assumption that the server binds a loopback or private interface.

        Covers chain progress (`payd_chain_lag_blocks`, reorg counters), node access
        (`payd_trongrid_requests_total`, `payd_trongrid_errors_total`,
        `payd_trongrid_quota_projection_ratio`), business state (`payd_orders_total`,
        `payd_payments_total`, `payd_payments_orphaned_unresolved`,
        `payd_withdrawals_total`, `payd_withdrawals_needs_operator`), wallet health
        (`payd_addresses_needing_resources`, `payd_balance_drift_addresses`), webhook
        delivery (`payd_ipn_attempts_total`, `payd_ipn_dead_total`,
        `payd_ipn_queue_depth`), and cost and freshness signals (`payd_energy_cost_trx_total`,
        `payd_energy_fee_sun`, `payd_price_age_seconds`, `payd_clock_skew_seconds`).

        Returns 503 if the metrics collector is not wired up or the underlying database
        read fails. Unlike the 200, that error is converted to the standard JSON error
        envelope on the way out.
      x-required-scope: ''
      x-requirements: [OPS-003]
      security: []
      responses:
        '200':
          description: Prometheus text exposition.
          content:
            text/plain:
              schema: {type: string}
        '503': {$ref: '#/components/responses/Unavailable'}
  /openapi.yaml:
    get:
      tags: [Documentation]
      summary: Download the embedded OpenAPI document
      description: |
        Serves this API description as OpenAPI 3.1 YAML. Requires no scope. Needs no API
        key and is not rate limited.

        The document is compiled into the binary, so it always matches the running build
        and is available with no network access and nothing to deploy alongside it. Point
        a client generator at this URL to produce a typed SDK.
      x-required-scope: ''
      x-requirements: [TD-007]
      security: []
      responses:
        '200':
          description: OpenAPI 3.1 YAML document.
          content:
            application/yaml:
              schema: {type: string}
  /docs:
    get:
      tags: [Documentation]
      summary: Open Swagger UI
      description: |
        Serves a Swagger UI page that renders `/openapi.yaml` and can issue live requests
        against this server. Requires no scope. Needs no API key and is not rate limited.

        Click **Authorize** and paste an API key to have the UI send `X-API-Key` on every
        request; the key is remembered for the browser session. Requests made from this
        page are real — they create real orders and real withdrawals against whatever
        network this instance is configured for.

        Only the HTML shell is served locally; the UI's JavaScript and CSS load from the
        jsDelivr CDN, so the page needs internet access to render. The API itself has no
        such dependency.
      x-required-scope: ''
      x-requirements: [API-020]
      security: []
      responses:
        '200':
          description: Swagger UI HTML shell.
          content:
            text/html:
              schema: {type: string}
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        Send the API key itself in this header — the plaintext secret, not the Argon2id
        `key_hash` that appears in the server's configuration file.

        The server stores only the hash and verifies every request by recomputing it,
        comparing in constant time. It never learns the key from configuration, and a
        leaked configuration file does not yield usable keys.

        Each key carries its own scopes. A missing header, an unknown key, and a valid key
        lacking the scope an operation requires all return the same 401 `unauthorized`
        with no detail about which it was — that is deliberate, so the response cannot be
        used to probe for valid keys.
  parameters:
    Limit:
      name: limit
      in: query
      description: >-
        Maximum rows to return in this page. Values outside 1-200 are rejected with
        400 `invalid_pagination`.
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
    Cursor:
      name: cursor
      in: query
      description: >-
        Position to resume from. Pass back the `next_cursor` returned by the previous
        page, unmodified; omit it for the first page. Treat the value as opaque — its
        encoding is not part of the contract. Anything that is not a cursor this API
        issued is 400 `invalid_pagination`.
      schema: {type: string}
    OrderID:
      name: id
      in: path
      required: true
      schema: {type: string, example: 01KZK772CKH6G9KTEM09TB7AFS}
    WithdrawalID:
      name: id
      in: path
      required: true
      schema: {type: string}
  responses:
    BadRequest:
      description: >-
        The request itself is wrong: malformed JSON, an unknown JSON field, a body over
        1 MiB, a missing required field, or a value that fails validation. Fix the request
        before retrying — repeating it unchanged gives the same result. The specific
        `code` says which; each operation lists the ones it can return.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Unauthorized:
      description: >-
        The caller is not allowed to make this call. Returned for a missing or wrong
        `X-API-Key`, for a valid key that lacks the scope this operation requires, and —
        on withdrawal creation — for a TOTP code that is wrong or already used. The first
        two are indistinguishable by design and return `unauthorized`; a TOTP failure
        returns `invalid_totp`.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    NotFound:
      description: >-
        No such resource, or none that this operation can act on. Some operations also use
        it for a resource that exists but is in the wrong state, so that a caller cannot
        probe which identifiers are real.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Conflict:
      description: >-
        The request is well-formed but disagrees with stored state — a reused idempotency
        key with different values, an order that already received funds, a source address
        flagged for drift, or a limit that would be exceeded. Read the `code` and act on
        it; retrying the same request unchanged will not succeed.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    RateLimited:
      description: >-
        Too many requests from this API key inside the current one-minute window: 100 per
        minute in general, 10 per minute on `/api/v1/withdrawals` and its subpaths. Windows
        are fixed, not sliding, and counted per key, so other keys are unaffected. Wait for
        the next minute and retry.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    InternalError:
      description: >-
        The processor failed unexpectedly. Nothing about the request needs changing; check
        the server logs. Because writes are transactional, a request that failed this way
        was either applied completely or not at all.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Unavailable:
      description: >-
        The request is fine but the processor cannot serve it right now — no fresh price
        quote, withdrawals turned off in configuration, or the address pool exhausted.
        These are transient states worth retrying later, unlike a 400 or a 409.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  schemas:
    Amount:
      type: string
      pattern: '^(0|[1-9][0-9]*)(\.[0-9]+)?$'
      description: Exact non-negative decimal amount represented as a string.
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, details]
          properties:
            code:
              type: string
              description: >-
                Stable machine-readable identifier for what went wrong. Branch on this.
                The set of codes an operation can return is listed under its
                `x-error-codes` extension.
              example: insufficient_balance
            message:
              type: string
              description: >-
                Human-readable explanation, for logs and operator consoles. Wording may
                change between releases; never match on it.
              example: confirmed balance is insufficient
            details:
              type: object
              additionalProperties: true
              description: >-
                Extra machine-readable context for codes that have any, otherwise empty.
                For `external_ref_conflict` it carries `fields`, the list of order
                attributes that disagreed.
              example: {}
    CreateOrderRequest:
      type: object
      additionalProperties: false
      required: [asset]
      oneOf:
        - required: [amount]
          not: {required: [amount_usd]}
        - required: [amount_usd]
          not: {required: [amount]}
      properties:
        asset:
          type: string
          description: Symbol of a configured asset, such as `TRX` or `USDT`.
          example: USDT
        amount:
          type: string
          description: >-
            What the payer must send, in whole asset units, as a positive decimal string.
            Supply this or `amount_usd`, never both.
          example: '1.5'
        amount_usd:
          type: string
          description: >-
            What the payer must send, expressed in USD as a positive decimal string and
            converted at the current price. The converted value must land on a whole base
            unit of the asset, otherwise the request is rejected. Supply this or `amount`,
            never both.
          example: '1.50'
        external_ref:
          type: string
          description: >-
            Your own identifier for this order — an invoice or cart id. Sending it again
            returns the existing order instead of creating a second one, provided the
            asset, amount and consumer match. Omit it and every call creates a new order.
          example: smoke-1
        consumer:
          type: string
          description: >-
            Which configured webhook consumer receives this order's payment events. Empty
            uses the configured default consumer. Cannot be changed once the order exists.
          example: local
        ttl_seconds:
          type: integer
          format: int64
          minimum: 0
          description: >-
            How long the payer has to pay, in seconds, from now. 0 or absent uses the
            configured default order TTL. After it elapses the order expires and its
            address is recycled.
          example: 1800
        metadata:
          description: >-
            Any JSON object of your own. Stored verbatim, returned on every read of this
            order, and included in its webhooks. Must be an object, not an array or scalar.
          example: {user_id: 1}
    Order:
      type: object
      required: [id, address, asset, amount, received, overpaid, status, consumer, metadata, expires_at, created_at, updated_at]
      properties:
        id:
          type: string
          description: Order identifier, a ULID assigned by the processor.
          example: 01KZK772CKH6G9KTEM09TB7AFS
        address:
          type: string
          description: >-
            The TRON address to pay, taken from the pool and held for this order until it
            completes or expires. Show this to the payer.
          example: TUEZSdKsoDHQMeZwihtdoBiN46zxhGWYdH
        asset:
          type: string
          description: Symbol of the asset the payer must send.
          example: USDT
        amount:
          type: string
          description: Amount due, in whole asset units, as a decimal string.
          example: '1.5'
        received:
          type: string
          description: >-
            Total attributed to this order so far, in whole asset units. Counts payments
            once detected, whether or not they are confirmed yet.
          example: '0'
        overpaid:
          type: string
          description: >-
            How much arrived beyond `amount`, in whole asset units. Non-zero means the
            payer sent too much and may be owed a refund.
          example: '0'
        status:
          type: string
          description: >-
            Where the order stands. `pending` — nothing received. `partial` — some but not
            all. `paid` — fully covered, awaiting block confirmations. `confirmed` — fully
            covered and irreversible. `expired` / `cancelled` — finished with nothing
            received. `expired_funded` / `cancelled_funded` — finished while holding money,
            which needs an operator decision through
            `POST /api/v1/orders/{id}/resolve`.
          example: pending
        consumer:
          type: string
          description: Webhook consumer receiving this order's payment events.
          example: local
        metadata:
          description: The JSON object supplied at creation, returned verbatim.
          example: {user_id: 1}
        expires_at:
          type: integer
          format: int64
          description: Unix seconds after which the order stops accepting payment.
          example: 1786279559
        created_at:
          type: integer
          format: int64
          description: Unix seconds when the order was created.
          example: 1786277759
        updated_at:
          type: integer
          format: int64
          description: Unix seconds of the last change to the order.
          example: 1786277759
        external_ref:
          type: string
          description: Your identifier for this order, if one was supplied.
          example: smoke-1
        price_usd:
          type: string
          description: >-
            The asset's USD price at creation, as a decimal string. Frozen at that moment,
            so later market movement does not change what the payer owes. Present only for
            orders that involved a price.
          example: '1.00'
        amount_usd:
          type: string
          description: >-
            The order's value in USD at creation, as a decimal string. Also what the daily
            withdrawal cap and reporting use.
          example: '1.50'
        resolution:
          type: string
          description: >-
            How an operator dealt with an order that finished while holding funds:
            `refunded`, `written_off` or `reattributed`. Absent until resolved.
          example: refunded
        resolution_note:
          type: string
          description: Free-text note recorded with the resolution, such as a refund transaction id.
          example: Refunded manually
        resolved_at:
          type: integer
          format: int64
          description: Unix seconds when the resolution was recorded.
          example: 1786280000
    Payment:
      type: object
      additionalProperties: false
      required: [id, txid, log_index, direction, block_height, block_timestamp, from_address, to_address, order_id, asset, amount, status, detected_at, confirmed_at]
      properties:
        id:
          type: integer
          format: int64
          description: >-
            Payment identifier assigned by the processor. This is the value to use in
            `POST /api/v1/payments/{id}/attribute`, not the transaction hash.
          example: 42
        txid:
          type: string
          description: Hash of the transaction that carried this transfer, for explorer lookups.
          example: a17c9e
        log_index:
          type: integer
          description: >-
            Position of this transfer within its transaction. One transaction can carry
            several token transfers; together with `txid` this identifies exactly one.
          example: 0
        direction:
          type: string
          description: '`in` for funds arriving at a pooled address, `out` for funds leaving it.'
          example: in
        block_height:
          type: integer
          format: int64
          description: Block that included the transaction.
          example: 71234567
        block_timestamp:
          type: integer
          format: int64
          description: Unix seconds of that block, i.e. when the transfer happened on chain.
          example: 1786277800
        from_address:
          type: string
          description: Sender. For an inbound payment this is the payer, and the address to refund.
          example: TPayerAddress
        to_address:
          type: string
          description: Recipient, normally the pooled address assigned to an order.
          example: TUEZSdKsoDHQMeZwihtdoBiN46zxhGWYdH
        order_id:
          type: [string, 'null']
          description: >-
            Order this payment counts towards. Null while unattributed, which is what the
            unattributed and orphaned listings return.
          example: 01KZK772CKH6G9KTEM09TB7AFS
        asset:
          type: string
          description: Symbol of the asset transferred.
          example: USDT
        amount:
          type: string
          description: Amount transferred, in whole asset units, as a decimal string.
          example: '1.5'
        status:
          type: string
          description: >-
            `unattributed` — seen on chain but not yet tied to an order. `seen` — attributed
            but not yet past the confirmation depth, so still reversible by a chain
            reorganisation. `confirmed` — final. `orphaned` — cannot be attributed at all
            and needs a human.
          example: confirmed
        detected_at:
          type: integer
          format: int64
          description: Unix seconds when the processor first saw this transfer.
          example: 1786277805
        confirmed_at:
          type: [integer, 'null']
          format: int64
          description: Unix seconds when it became irreversible; null until then.
          example: 1786277900
    CreateWithdrawalRequest:
      type: object
      additionalProperties: false
      required: [from_address, to_address, asset, amount, totp]
      properties:
        from_address:
          type: string
          description: >-
            Pooled address to send from. It must be known to the processor, not disabled,
            not flagged for balance drift, and hold enough **confirmed** balance.
          example: TUEZSdKsoDHQMeZwihtdoBiN46zxhGWYdH
        to_address:
          type: string
          description: >-
            External TRON address to send to. Validated for format only — the processor
            cannot tell you whether it is the right destination, and a transfer cannot be
            recalled.
          example: TVjsyZ7fYF3qLF6BQgPmTEZy1xrNNyVAAA
        asset:
          type: string
          description: Symbol of a configured asset to send.
          example: USDT
        amount:
          type: string
          description: Amount to send, in whole asset units, as a positive decimal string.
          example: '1.0'
        totp:
          type: string
          writeOnly: true
          pattern: '^[0-9]{6}$'
          description: >-
            Six-digit code from the configured authenticator, when withdrawals are set to
            require one. Accepted within one 30-second step either side of the current
            code, and each code works once — its use is stored, so restarting the service
            does not make it reusable. Retrying with the same `Idempotency-Key` does not
            need a new code. Request bodies are never written to the logs, so codes do not
            leak there.
          example: '482910'
    Withdrawal:
      type: object
      additionalProperties: false
      required: [id, from_address, to_address, asset, amount, amount_raw, amount_usd, status, txid, failure_reason, resolved_by, broadcast_response, fee_raw, network_fee_trx, energy_used, energy_source, energy_cost_trx, bandwidth_source, bandwidth_cost_trx, resource_fee_trx, total_cost_trx, last_lookup_error, created_at, broadcast_at, confirmed_at]
      properties:
        id:
          type: string
          description: Withdrawal identifier, a ULID assigned by the processor.
          example: 01KZK8B5H1KM6XACMG7MK57J8W
        from_address:
          type: string
          description: Pooled address the funds leave.
          example: TUEZSdKsoDHQMeZwihtdoBiN46zxhGWYdH
        to_address:
          type: string
          description: External address the funds go to.
          example: TVjsyZ7fYF3qLF6BQgPmTEZy1xrNNyVAAA
        asset:
          type: string
          description: Symbol of the asset being sent.
          example: USDT
        amount:
          type: string
          description: Amount to send, in whole asset units, as a decimal string.
          example: '1'
        amount_raw:
          type: string
          description: >-
            The same amount in base units (SUN for TRX, 6-decimal units for USDT), as a
            decimal string. This is the exact integer the signed transaction carries.
          example: '1000000'
        amount_usd:
          type: string
          description: >-
            USD value fixed at the moment the request was accepted, as a decimal string.
            This is what counts against the daily cap, so the cap does not move with the
            market.
          example: '1'
        status:
          type: string
          description: >-
            `requested` — accepted, nothing signed yet. `awaiting_resources` /
            `awaiting_energy` — waiting for bandwidth or energy on the source address.
            `signing` — being signed. `broadcast` — sent to the network, awaiting inclusion.
            `confirmed` — final; the funds have left. `failed` — did not go out, see
            `failure_reason`. `needs_operator` — the outcome could not be determined
            automatically and a human must check the chain; this is the one status that
            always warrants an alert.
          example: requested
        txid:
          type: string
          description: >-
            Hash of the broadcast transaction, for explorer lookups. Empty until broadcast.
          example: ''
        failure_reason:
          type: string
          description: Why the withdrawal did not go out. Empty unless it failed.
          example: ''
        resolved_by:
          type: string
          description: >-
            Who closed out a withdrawal that needed a human. Empty unless an operator acted.
          example: ''
        broadcast_response:
          type: string
          description: >-
            The node's raw reply to the broadcast, kept verbatim for diagnosis when the
            transfer was rejected. Empty otherwise.
          example: ''
        fee_raw:
          type: string
          description: >-
            Fee the chain charged, in SUN, as a decimal string. Already includes any TRX
            burned for energy or bandwidth.
          example: '0'
        network_fee_trx:
          type: string
          description: The same chain fee expressed in TRX, as a decimal string.
          example: '0'
        energy_used:
          type: integer
          format: int64
          description: Energy the transaction consumed. Token transfers use energy; plain TRX transfers do not.
          example: 0
        energy_source:
          type: string
          description: >-
            Where the energy came from — the account's own staked energy, a delegation, a
            rental, or TRX burned to cover it. Empty until execution.
          example: ''
        energy_cost_trx:
          type: string
          description: TRX spent on energy, as a decimal string.
          example: '0'
        bandwidth_source:
          type: string
          description: >-
            Where the bandwidth came from — free daily allowance, staked bandwidth, a
            delegation, or TRX burned to cover it. Empty until execution.
          example: ''
        bandwidth_cost_trx:
          type: string
          description: TRX spent on bandwidth, as a decimal string.
          example: '0'
        resource_fee_trx:
          type: string
          description: Energy and bandwidth cost combined, in TRX, as a decimal string.
          example: '0'
        total_cost_trx:
          type: string
          description: >-
            Everything this withdrawal cost in TRX — chain fee plus any rented resources —
            as a decimal string. Burned energy and bandwidth are already inside the chain
            fee and are not counted twice.
          example: '0'
        last_lookup_error:
          type: string
          description: >-
            Why the most recent attempt to check this transaction on chain failed. A
            populated value here means the status may be behind reality, not that the
            withdrawal itself failed.
          example: ''
        created_at:
          type: integer
          format: int64
          description: Unix seconds when the request was accepted.
          example: 1786279000
        broadcast_at:
          type: [integer, 'null']
          format: int64
          description: Unix seconds when the transaction was sent to the network; null until then.
        confirmed_at:
          type: [integer, 'null']
          format: int64
          description: Unix seconds when it became irreversible; null until then.
    OrderList:
      type: object
      additionalProperties: false
      required: [orders, next_cursor]
      properties:
        orders: {type: array, items: {$ref: '#/components/schemas/Order'}}
        next_cursor:
          type: string
          description: >-
            Pass back as `cursor` for the next page. Empty means this was the last page.
          example: ''
    FundedOrder:
      allOf:
        - {$ref: '#/components/schemas/Order'}
        - type: object
          required: [payers]
          properties:
            payers:
              type: array
              items: {type: string}
              description: >-
                Distinct sender addresses of this order's inbound payments — where the
                money came from, and so where a refund would go. Included here so the
                operator queue is actionable without a chain lookup.
    FundedOrderList:
      type: object
      additionalProperties: false
      required: [orders, next_cursor]
      properties:
        orders: {type: array, items: {$ref: '#/components/schemas/FundedOrder'}}
        next_cursor:
          type: string
          description: >-
            Pass back as `cursor` for the next page. Empty means this was the last page.
          example: ''
    PaymentList:
      type: object
      additionalProperties: false
      required: [payments, next_cursor]
      properties:
        payments: {type: array, items: {$ref: '#/components/schemas/Payment'}}
        next_cursor:
          type: string
          description: >-
            Pass back as `cursor` for the next page. Empty means this was the last page.
          example: ''
    WithdrawalList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Withdrawal'}
          description: >-
            Withdrawals, newest first. This listing does not page — there is no cursor, so
            it returns at most `limit` rows.
    WithdrawalLimits:
      type: object
      additionalProperties: false
      required: [daily_limit_usd, used_usd, remaining_usd]
      properties:
        daily_limit_usd:
          type: string
          description: The configured cap on withdrawals per UTC day, in USD, as a decimal string.
          example: '5000'
        used_usd:
          type: string
          description: >-
            USD value of withdrawals created since 00:00 UTC that are still in flight or
            already confirmed, as a decimal string. Failed and cancelled ones do not count.
          example: '0'
        remaining_usd:
          type: string
          description: >-
            What is still available today, as a decimal string. Never below zero. A
            withdrawal worth more than this is refused with 409 `daily_limit_exceeded`.
          example: '5000'
    WalletPage:
      type: object
      additionalProperties: false
      required: [wallets, next_cursor]
      properties:
        wallets: {type: array, items: {$ref: '#/components/schemas/WalletResource'}}
        next_cursor: {type: string}
    WalletDetail:
      allOf:
        - {$ref: '#/components/schemas/WalletResource'}
        - type: object
          required: [payments]
          properties: {payments: {type: array, items: {$ref: '#/components/schemas/Payment'}}}
    ResourceGrant:
      type: object
      additionalProperties: false
      required: [id, address, resource_type, amount, stake_trx, status, txid]
      properties:
        id: {type: string}
        address: {type: string}
        resource_type: {type: string, enum: [ENERGY, BANDWIDTH]}
        amount: {type: integer, format: int64, description: Requested resource units.}
        stake_trx: {type: string, description: Delegated staked TRX represented as a decimal string.}
        status: {type: string}
        txid: {type: string}
    DeadIPNPage:
      type: object
      additionalProperties: false
      required: [events, next_cursor]
      properties:
        events:
          type: array
          items:
            type: object
            required: [id, order_id, consumer, event_type, attempts, last_error, last_status_code, created_at]
            properties:
              id: {type: string}
              order_id: {type: string}
              consumer: {type: string}
              event_type: {type: string}
              attempts: {type: integer}
              last_error: {type: string}
              last_status_code: {type: integer}
              created_at: {type: integer, format: int64}
        next_cursor: {type: string}
    IPNConsumerPage:
      type: object
      additionalProperties: false
      required: [consumers, next_cursor]
      properties:
        consumers:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, enabled, receives_global, pending, dead]
            properties:
              name: {type: string}
              enabled: {type: boolean}
              receives_global: {type: boolean}
              pending: {type: integer, format: int64}
              dead: {type: integer, format: int64}
        next_cursor: {type: string}
    ChainParameters:
      type: object
      additionalProperties: false
      required: [getEnergyFee, getTransactionFee, fetched_at, stale]
      properties:
        getEnergyFee: {type: integer, format: int64, description: Sun charged per energy unit.}
        getTransactionFee: {type: integer, format: int64, description: Sun charged per bandwidth unit.}
        fetched_at: {type: integer, format: int64}
        stale: {type: boolean}
    PricePage:
      type: object
      additionalProperties: false
      required: [prices, next_cursor]
      properties:
        prices:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [symbol, price_usd, source, fetched_at, stale]
            properties:
              symbol: {type: string}
              price_usd: {type: string}
              source: {type: string}
              fetched_at: {type: integer, format: int64}
              stale: {type: boolean}
        next_cursor: {type: string}
    OperationalStats:
      type: object
      description: Shared store.OperationalMetrics JSON representation.
      additionalProperties: true
    EnergyStatus:
      type: object
      additionalProperties: false
      required: [provider, balance_trx, consecutive_failures, purchases]
      properties:
        provider: {type: string}
        balance_trx: {type: string}
        last_checked_at: {type: [integer, 'null'], format: int64}
        last_error: {type: string}
        consecutive_failures: {type: integer, format: int64}
        purchases: {type: object, additionalProperties: {type: integer, format: int64}}
    EnergyPurchasePage:
      type: object
      additionalProperties: false
      required: [purchases, next_cursor]
      properties:
        purchases:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, provider, provider_order_id, withdrawal_id, receiver_address, resource_type, amount, duration_seconds, quoted_trx, actual_trx, status, failure_reason, delegation_txid, created_at, delegated_at]
            properties:
              id: {type: string}
              provider: {type: string}
              provider_order_id: {type: string}
              withdrawal_id: {type: string}
              receiver_address: {type: string}
              resource_type: {type: string, enum: [ENERGY, BANDWIDTH]}
              amount: {type: integer, format: int64}
              duration_seconds: {type: integer, format: int64}
              quoted_trx: {type: string}
              actual_trx: {type: string}
              status: {type: string}
              failure_reason: {type: string}
              delegation_txid: {type: string}
              created_at: {type: integer, format: int64}
              delegated_at: {type: [integer, 'null'], format: int64}
        next_cursor: {type: string}
    WalletResourceList:
      type: object
      additionalProperties: false
      required: [addresses, total]
      properties:
        addresses:
          type: array
          items: {$ref: '#/components/schemas/WalletResource'}
          description: Every address currently short of resources. Not paged.
        total:
          type: integer
          minimum: 0
          description: Number of entries in `addresses`. Zero means no address needs attention.
          example: 0
    WalletResource:
      type: object
      additionalProperties: false
      required: [address, hd_index, state, balances, energy, bandwidth, trx_for_bandwidth_burn, can_withdraw, blocked_by, drift_detected, needs_resources]
      properties:
        address:
          type: string
          description: The pooled TRON address this entry describes.
          example: TUEZSdKsoDHQMeZwihtdoBiN46zxhGWYdH
        hd_index:
          type: integer
          format: int64
          description: >-
            Position of this address in the wallet's derivation path. Together with the
            seed it is what regenerates the private key during recovery.
          example: 7
        state: {type: string, enum: [free, assigned, cooling, disabled]}
        needs_resources: {type: boolean}
        balances:
          type: array
          description: What the address holds, one entry per asset.
          items:
            type: object
            required: [asset, confirmed, pending, drift_detected]
            properties:
              asset: {type: string, example: USDT}
              confirmed:
                type: string
                description: >-
                  Balance backed by irreversible payments, in whole asset units. Only this
                  can be withdrawn.
                example: '142.5'
              pending:
                type: string
                description: >-
                  Balance from payments seen but not yet irreversible, in whole asset
                  units. Reported separately and never spendable, because a chain
                  reorganisation can still take it away.
                example: '0'
              usd:
                type: string
                description: >-
                  Value of the confirmed balance in USD. Omitted rather than estimated when
                  no fresh price quote is available.
                example: '142.50'
              drift_detected:
                type: boolean
                description: >-
                  True when the computed balance for this asset disagrees with the chain.
                  Blocks withdrawals from the address until cleared.
        energy:
          $ref: '#/components/schemas/ResourceState'
          description: >-
            Energy position. Token transfers consume energy; a plain TRX transfer does not.
        bandwidth:
          $ref: '#/components/schemas/ResourceState'
          description: Bandwidth position. Every transaction consumes bandwidth.
        trx_for_bandwidth_burn:
          type: string
          description: >-
            Confirmed TRX held, in whole units — the fallback for paying bandwidth by
            burning when the address has none staked or delegated.
          example: '0'
        can_withdraw:
          type: object
          additionalProperties: {type: boolean}
          description: >-
            Per asset, whether a withdrawal could go out right now. True requires no
            balance drift, bandwidth covered (held or burnable with TRX), and — for token
            assets only — enough energy.
          example: {TRX: false, USDT: false}
        blocked_by:
          type: array
          items: {type: string}
          description: Which resources are short — `bandwidth`, `energy`, or both.
          example: [bandwidth]
        drift_detected:
          type: boolean
          description: >-
            True when any asset on this address is flagged for balance drift. All
            withdrawals from it are refused with 409 `balance_drift` until an operator
            clears the flag.
        checked_at:
          type: integer
          format: int64
          description: Unix seconds when this address was last polled on chain. Absent if never polled.
          example: 1786279400
        estimated_burn_trx:
          type: string
          description: >-
            TRX that a transfer would burn at the current on-chain energy price, if the
            address covered its resources by burning. Present once chain parameters have
            been read.
          example: '27.51'
        energy_fee_sun:
          type: integer
          format: int64
          description: >-
            The network's current price per unit of energy, in SUN. Set by chain
            governance and can change, which is why `estimated_burn_trx` is recomputed
            rather than assumed.
          example: 210
    ResourceState:
      type: object
      additionalProperties: false
      required: [available, limit, required, sufficient]
      properties:
        available:
          type: integer
          format: int64
          description: Units left to spend right now, i.e. the allowance minus what has been used.
          example: 0
        limit:
          type: integer
          format: int64
          description: >-
            Total units the account is granted per period, from staking, delegation and
            the free daily allowance.
          example: 0
        required:
          type: integer
          format: int64
          description: Units a transfer needs, per configuration, for this address to count as ready.
          example: 131000
        sufficient:
          type: boolean
          description: Whether `available` currently meets `required`.
          example: false
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok
          description: Always `ok` — the process answered, which is all this probe asserts.
    Readiness:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ready, degraded]
          description: >-
            `ready` when every dependency is healthy, `degraded` when at least one is not.
            `degraded` is returned with HTTP 503.
        reasons:
          type: array
          items: {type: string}
          description: >-
            Which checks are failing, when degraded. Absent or empty when ready. See the
            `/readyz` description for what each value means.
          example: [price_stale]
