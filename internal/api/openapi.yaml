        Cancels an order so it stops accepting payment, and returns the updated order.

        Requires scope `orders:write`. Rate limit 100 requests/minute per API key.

        The request body is optional; its only field is `force`.

        **Unfunded orders** (status `pending`) cancel without `force`.

