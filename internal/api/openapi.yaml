      type: object
      additionalProperties: false
      required: [available, limit, required, sufficient]
      properties:
        available: {type: integer, format: int64, example: 0}
        limit: {type: integer, format: int64, example: 0}
        required: {type: integer, format: int64, example: 131000}
        sufficient: {type: boolean, example: false}
