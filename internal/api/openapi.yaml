        operator queue at `GET /api/v1/orders/funded-terminal`.

        Requires scope `orders:write`. Rate limit 100 requests/minute per API key.

        **This is bookkeeping only.** It moves no funds and broadcasts no transaction.
        Refund or reassign the money first, then record what you did here.

        `resolution` must be one of `refunded` (money sent back to the payer),
        `written_off` (kept, no further action) or `reattributed` (credited elsewhere);
        anything else is 400 `invalid_order`. `resolution_note` is free text for the
        audit trail — put the refund transaction id or the ticket reference in it.

        Only an order in `expired_funded` or `cancelled_funded` that has not been
        resolved yet can be resolved. An unknown identifier, an order in any other
        status, and an order already resolved are all 404 `not_found` — resolving is not
        idempotent, so treat a 404 after a success as "already recorded".

        **Side effect.** Writes an audit-log entry naming the API key that made the call,
        the resolution and the note.
